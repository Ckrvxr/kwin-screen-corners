name: Build and release Debian packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: amd64
          - arch: arm64
            platform: arm64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Enable cross-architecture containers
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Build Debian package in Debian Trixie
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/${{ matrix.arch }}"
          docker run --rm \
            --platform "linux/${{ matrix.platform }}" \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            debian:trixie-slim \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                ca-certificates \
                clang \
                cmake \
                debhelper-compat \
                dpkg-dev \
                extra-cmake-modules \
                git \
                libkf6config-dev \
                libkf6coreaddons-dev \
                libkf6i18n-dev \
                libkf6kcmutils-dev \
                kwin-dev \
                libepoxy-dev \
                ninja-build \
                pkg-config \
                qt6-base-dev
              git config --global --add safe.directory /workspace
              dpkg-buildpackage -us -uc -b
              cp /kwin-screen-corners_*.deb "/workspace/out/${{ matrix.arch }}/"
            '

      - name: Upload Debian packages
        uses: actions/upload-artifact@v4
        with:
          name: kwin-screen-corners-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/*.deb
          if-no-files-found: error

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: kwin-screen-corners-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
